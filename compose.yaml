services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diskard
      POSTGRES_USER: diskard
      POSTGRES_PASSWORD: ${DISKARD_DB_PASSWORD:-CHANGE_ME}
    volumes:
      - diskard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diskard -d diskard"]
      interval: 5s
      timeout: 5s
      retries: 20

  diskard:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DISKARD_HOST: ${DISKARD_HOST:-0.0.0.0}
      DISKARD_PORT: 8700
      DISKARD_PUBLISHED_PORT: ${DISKARD_PUBLISHED_PORT:-8700}
      DISKARD_DB_HOST: postgres
      DISKARD_DB_PASSWORD: ${DISKARD_DB_PASSWORD:-CHANGE_ME}
      DISKARD_LOG_LEVEL: ${DISKARD_LOG_LEVEL:-INFO}
      DISKARD_BUILD_SHA: ${DISKARD_BUILD_SHA:-unknown}
      DISKARD_PROFILE_FILE: /config/targets.yaml
      DISKARD_EVENT_MAX_BYTES: ${DISKARD_EVENT_MAX_BYTES:-262144}
      DISKARD_EXPORT_MAX_BYTES: ${DISKARD_EXPORT_MAX_BYTES:-52428800}
      DISKARD_ALLOWED_ORIGINS: ${DISKARD_ALLOWED_ORIGINS:-http://localhost:${DISKARD_PUBLISHED_PORT:-8700},http://127.0.0.1:${DISKARD_PUBLISHED_PORT:-8700}}
      DISKARD_ALLOWED_HOSTS: ${DISKARD_ALLOWED_HOSTS:-localhost,127.0.0.1,host.docker.internal}
      GISKARD_TELEMETRY_DISABLED: ${GISKARD_TELEMETRY_DISABLED:-true}
      GISKARD_QUIET: ${GISKARD_QUIET:-true}
      DISKARD_ATTACKER_TARGET_KEY: ${DISKARD_ATTACKER_TARGET_KEY:-}
      DISKARD_TRIGGER_TARGET_KEY: ${DISKARD_TRIGGER_TARGET_KEY:-}
      DISKARD_SUBJECT_TARGET_KEY: ${DISKARD_SUBJECT_TARGET_KEY:-}
      DISKARD_SUBJECT_TARGET_TOKEN: ${DISKARD_SUBJECT_TARGET_TOKEN:-}
      DISKARD_CONTROL_TARGET_KEY: ${DISKARD_CONTROL_TARGET_KEY:-}
      DISKARD_TARGET_MONGO_URI: ${DISKARD_TARGET_MONGO_URI:-}
      DISKARD_KEYCLOAK_CLIENT_ID: ${DISKARD_KEYCLOAK_CLIENT_ID:-}
      DISKARD_KEYCLOAK_CLIENT_SECRET: ${DISKARD_KEYCLOAK_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ATTACKER_MODEL: ${ATTACKER_MODEL:-openai/gpt-4o-mini}
    ports:
      - "127.0.0.1:${DISKARD_PUBLISHED_PORT:-8700}:8700"
    stop_grace_period: 90s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  diskard_pgdata:

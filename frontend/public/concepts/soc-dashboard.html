      const consoleEndRef = useRef(null);
      const canvasRef = useRef(null);

      // Auto scroll console
      useEffect(() => {
        consoleEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [logs]);

      // Stream fake logs & fluctuate metrics
      useEffect(() => {
        const interval = setInterval(() => {
          const timestamp = new Date().toISOString().slice(11, 23);
          const probePool = [
            `[${timestamp}] [PROBE] Injecting base64 zero-day mutation #${Math.floor(Math.random() * 900 + 100)}`,

          ];
          const next = probePool[Math.floor(Math.random() * probePool.length)];
          setLogs((prev) => [...prev.slice(-40), next]);

          setLeakageProbability((prev) => Math.min(100, Math.max(70, prev + (Math.random() * 6 - 3))));
          setFilterBypass((prev) => Math.min(100, Math.max(86, prev + (Math.random() * 4 - 2))));
        }, 2200);

        return () => clearInterval(interval);
      }, []);

      // Canvas Visualizer
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let frameId;
        let angle = 0;

        const resize = () => {
          canvas.width = canvas.parentElement.clientWidth;
          canvas.height = canvas.parentElement.clientHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const particles = Array.from({ length: 48 }, () => ({
          x: Math.random() * 360 - 180,
          y: Math.random() * 360 - 180,
          z: Math.random() * 260 - 130,
          size: Math.random() * 2.5 + 1.2,
          isCompromised: Math.random() > 0.45,
        }));

        const render = () => {
          ctx.fillStyle = '#0F1115';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          angle += 0.009;

          // Grid concentric rings
          ctx.strokeStyle = '#1F242E';
          ctx.lineWidth = 1;
          for (let r = 50; r <= 200; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();

          grad.addColorStop(0, 'rgba(229, 57, 53, 0.28)');
          grad.addColorStop(0.12, 'transparent');
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cx, cy, 210, 0, Math.PI * 2);
          ctx.fill();

          ctx.arc(cx, cy, 18, 0, Math.PI * 2);
          ctx.fillStyle = '#E53935';
          ctx.shadowColor = '#E53935';
          ctx.shadowBlur = 24;
          ctx.fill();
          ctx.shadowBlur = 0;

          // Render 3D rotated node particles
          particles.forEach((p) => {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const rx = p.x * cos - p.z * sin;
            const rz = p.x * sin + p.z * cos;
            const scale = 260 / (260 + rz);

            const sx = cx + rx * scale;
            const sy = cy + p.y * scale;

            if (p.isCompromised) {

              ctx.lineTo(sx, sy);
              ctx.strokeStyle = 'rgba(229, 57, 53, 0.2)';
              ctx.lineWidth = 1;
              ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(sx, sy, p.size * scale, 0, Math.PI * 2);
            ctx.fillStyle = p.isCompromised ? '#E53935' : '#4DB6AC';
            ctx.fill();
          });

          // HUD overlay box
          ctx.strokeStyle = '#B0BEC5';
          ctx.strokeRect(cx - 90, cy - 70, 180, 140);
          ctx.font = '10px "JetBrains Mono", monospace';
          ctx.fillStyle = '#E53935';
          ctx.fillText('TARGET_KERNEL: LLM_CORE [EXPOSED]', cx - 85, cy - 78);
          ctx.fillStyle = '#4DB6AC';
          ctx.fillText('ATTACK BEAMS: 22 CONNECTED', cx - 85, cy + 86);

          frameId = requestAnimationFrame(render);
        };

        render();
        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', resize);
        };
      }, []);

                          }`}
                        >
                          CONFIDENCE: {pair.score}%
                        </span>
                      </div>

                      {/* INPUT PROMPT */}
                      <div className="mt-3 space-y-1">
                        <div className="font-mono text-[10px] text-[#B0BEC5] uppercase tracking-wider font-semibold">
                          Adversarial Prompt Payload:
                        </div>
                        <div className="font-mono text-xs p-2.5 rounded bg-[#0C0E11] text-[#CFD8DC] border border-[#242832] overflow-x-auto whitespace-pre-wrap selection:bg-[#E53935]">
                          {pair.adversarialPrompt}
                        </div>
                      </div>

                      {/* AGENT RAW RESPONSE */}
                      <div className="mt-3 space-y-1">
                        <div className="font-mono text-[10px] text-[#B0BEC5] uppercase tracking-wider font-semibold">
                          Agent Raw Output & Function Execution:
                        </div>
                        <div
                          className={`font-mono text-xs p-2.5 rounded border overflow-x-auto whitespace-pre-wrap ${
                            isSmokingGun
                              ? 'bg-[#1C0D0E] text-[#FF8A80] border-[#E53935]/40 font-semibold'
                              : 'bg-[#0C0E11] text-[#B0BEC5] border-[#242832]'
                          }`}
                        >
                          {pair.agentResponse}
                        </div>
                      </div>

                      {/* LEAKED EXFILTRATED ARTIFACT */}
                      {pair.leakedArtifact && (
                        <div className="mt-3 p-2 bg-[#E53935] text-white rounded font-mono text-xs flex items-center justify-between">
                          <span className="truncate pr-2">EXFILTRATED: {pair.leakedArtifact}</span>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              navigator.clipboard?.writeText(pair.leakedArtifact || '');
                              alert('Artifact copied to clipboard!');
                            }}
                            className="px-2 py-0.5 bg-black/40 hover:bg-black text-[10px] uppercase font-bold rounded shrink-0"
                          >
                            Copy Payload
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <div className="p-4 border-t border-[#2A2E35] bg-[#16181D] font-mono text-xs flex items-center justify-between text-[#B0BEC5]">
                <span>MITRE ATLAS: AML.T0054</span>
                <span className="text-[#E53935] font-bold">CVSS SCORE: 9.8 / 10.0</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render React to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

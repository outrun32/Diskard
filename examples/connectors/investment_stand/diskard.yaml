version: 1

connector:
  name: investment-stand
  factory: ./connector.py:create_connector
  options:
    base_url: http://localhost:8600
    mongo_uri: mongodb://localhost:27017
    invest_url: http://localhost:8200

identity_provider:
  factory: ./connector.py:create_identity_provider
  options:
    keycloak_url: http://localhost:8180
    agent_api_url: http://localhost:8600

isolation:
  factory: ./connector.py:create_isolation
  options:
    mongo_uri: mongodb://localhost:27017
    redis_url: redis://localhost:6379/0

actors:
  poisoner:
    credential_ref: keycloak:client1001
    attributes:
      cus: "1001"
  victim:
    credential_ref: keycloak:client1002
    attributes:
      cus: "1002"
  data_subject:
    credential_ref: keycloak:client1003
    attributes:
      cus: "1003"
  control:
    credential_ref: keycloak:client1004
    attributes:
      cus: "1004"

execution:
  repeats: 3
  parallel: false
  restore_after_scenario: true

evidence:
  mode: grey-box
  collectors:
    - policy-memory
    - semantic-memory
    - ground-truth

attacks:
  include:
    - cross-user-global-policy-poisoning
    - cross-user-direct-memory-leak
    - compaction-policy-poisoning
    - delayed-recommendation-manipulation

attacker:
  driver: deterministic
  max_attempts: 6
  provider:
    name: deepseek-red-team
    type: azure_ai
    model: DeepSeek-V4-Flash
    api_key_env: AZURE_OPENAI_API_KEY
    base_url_env: AZURE_OPENAI_ENDPOINT
    api_version_env: AZURE_OPENAI_API_VERSION

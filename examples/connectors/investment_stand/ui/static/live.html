<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#26221a">
<title>Diskard — живая атака</title>
<script>
  (function () {
    try {
      if (localStorage.getItem('diskard-theme') === 'light') {
        document.documentElement.classList.add('light');
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Alumni+Sans:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: oklch(15% .006 95); --panel: oklch(20% .006 95); --panel-2: oklch(30% .008 95);
    --border: oklch(78% 0 0 / .16); --text: oklch(88% 0 0); --muted: oklch(72% 0 0); --faint: oklch(58% 0 0);
    --accent: oklch(84% .19 80.46); --accent-deep: oklch(61% .085 78); --accent-ink: oklch(16% .03 80);
    --accent-bg: oklch(84% .19 80.46 / .14); --accent-border: oklch(84% .19 80.46 / .4);
    --accent-glow: oklch(84% .19 80.46 / .05);
    --ok: oklch(74% .14 152); --ok-bg: oklch(72% .14 152 / .16); --ok-border: oklch(72% .14 152 / .4);
    --bad: oklch(70% .18 28); --bad-bg: oklch(62% .18 28 / .16); --bad-border: oklch(62% .18 28 / .42);
    --warn: oklch(80% .15 70); --warn-bg: oklch(80% .15 70 / .16); --warn-border: oklch(80% .15 70 / .4);
    --radius: 8px; --radius-sm: 4px; --radius-pill: 999px;
    --shadow: 0 10px 28px oklch(0% 0 0 / .45); --shadow-sm: 0 2px 6px oklch(0% 0 0 / .35);
    --mono: "SFMono-Regular", "Roboto Mono", "JetBrains Mono", Consolas, monospace;
    --sans: "Albert Sans", "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif;
    --display: "Alumni Sans", "Albert Sans", Arial, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  .light {
    color-scheme: light;
    --bg: oklch(97% .012 95); --panel: oklch(99% .008 95); --panel-2: oklch(91% .012 95);
    --border: oklch(25% .02 95 / .14); --text: oklch(25% .018 95); --muted: oklch(45% .015 95); --faint: oklch(58% .012 95);
    --accent: oklch(49% .09 188); --accent-deep: oklch(70% .12 188); --accent-ink: oklch(99% .01 95);
    --accent-bg: oklch(49% .09 188 / .10); --accent-border: oklch(49% .09 188 / .35);
    --accent-glow: oklch(49% .09 188 / .05);
    --ok: oklch(45% .13 152); --ok-bg: oklch(45% .13 152 / .10); --ok-border: oklch(45% .13 152 / .35);
    --bad: oklch(52% .17 30); --bad-bg: oklch(52% .17 30 / .10); --bad-border: oklch(52% .17 30 / .35);
    --warn: oklch(50% .15 70); --warn-bg: oklch(50% .15 70 / .12); --warn-border: oklch(50% .15 70 / .35);
    --shadow: 0 10px 28px oklch(25% .02 95 / .14); --shadow-sm: 0 2px 6px oklch(25% .02 95 / .08);
  }
  * { box-sizing: border-box; }
  body {
    background:
      radial-gradient(1200px 480px at 12% -10%, var(--accent-glow), transparent 60%),
      var(--bg);
    color: var(--text); margin: 0; padding: 28px 32px 48px;
    font-family: var(--sans); font-size: 14px; line-height: 1.45;
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }
  .wrap { max-width: 1360px; margin: 0 auto; }
  .kicker { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 6px; font-family: var(--sans); }
  h1 { font-family: var(--display); font-size: 26px; font-weight: 500; margin: 0 0 4px; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .header-row { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .header-text { flex: 1; min-width: 0; }
  .sub { color: var(--muted); margin-bottom: 0; font-size: 12.5px; }
  .sub code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-family: var(--mono); color: var(--text); }
  a.navlink { color: var(--accent); text-decoration: none; font-weight: 500; }
  a.navlink:hover { text-decoration: underline; }
  .theme-toggle {
    flex: none; width: 34px; height: 34px; padding: 0; border-radius: var(--radius-sm);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-size: 15px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .theme-toggle:hover { border-color: var(--accent-border); color: var(--accent); }
  .controls {
    display: flex; gap: 14px; align-items: end; margin-bottom: 18px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow-sm);
  }
  .controls label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; min-width: 220px;
  }
  select:focus, button:focus-visible { outline: 2px solid var(--accent-border); outline-offset: 1px; }
  button {
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: var(--radius-sm); padding: 10px 18px; font-weight: 650; font-size: 13px; cursor: pointer;
    transition: filter .12s ease, transform .12s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { background: var(--panel-2); color: var(--muted); cursor: not-allowed; }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover:not(:disabled) { border-color: var(--accent-border); filter: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--shadow-sm);
  }
  .panel h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700;
    color: var(--muted); margin: 0 0 12px; display: flex; align-items: center; gap: 7px; }
  .panel h2::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-deep); flex: none; }
  .status-badge { display: inline-block; padding: 3px 9px; border-radius: var(--radius-pill); font-size: 10.5px;
    font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .status-running { background: var(--warn-bg); color: var(--warn); }
  .status-done { background: var(--ok-bg); color: var(--ok); }
  .status-error { background: var(--bad-bg); color: var(--bad); }
  #transcript { height: 420px; overflow-y: auto; font-family: var(--mono); }
  .step { border-bottom: 1px solid var(--border); padding: 10px 10px; font-size: 12.5px; border-radius: var(--radius-sm); }
  .step .who { color: var(--accent); font-weight: 700; }
  .step .label { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; }
  .step .msg { margin: 5px 0; white-space: pre-wrap; word-break: break-word; font-family: var(--sans); }
  .step .reply { margin: 5px 0 0 12px; padding: 6px 0 6px 10px; border-left: 2px solid var(--border);
    white-space: pre-wrap; word-break: break-word; color: var(--text); font-family: var(--sans); }
  .step.risk-inject { border-left: 3px solid var(--bad); background: var(--bad-bg); }
  .step.risk-commit { border-left: 3px solid var(--warn); background: var(--warn-bg); }
  .step.risk-trigger { border-left: 3px solid var(--accent); background: var(--accent-bg); }
  .step.risk-info { border-left: 3px solid transparent; }
  .step .fam { color: var(--muted); font-size: 10px; text-transform: none; opacity: .8; }
  #memoryEvents { min-height: 40px; }
  .mem-event { border-radius: var(--radius); padding: 10px 12px; margin-bottom: 9px; font-size: 12.5px; }
  .mem-event .mem-who { color: var(--muted); font-size: 10.5px; margin-bottom: 4px; font-family: var(--mono); }
  .mem-danger { background: var(--bad-bg); border: 1px solid var(--bad-border); }
  .mem-warn { background: var(--warn-bg); border: 1px solid var(--warn-border); }
  .mem-info { background: var(--panel-2); border: 1px solid var(--border); }
  .mem-clean { background: var(--ok-bg); border: 1px solid var(--ok-border); }
  @keyframes flash-in {
    0% { box-shadow: 0 0 0 2px var(--accent-border); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .flash-in { animation: flash-in 1.1s ease-out; }
  .verdict { font-size: 22px; font-weight: 700; padding: 6px 0 10px; letter-spacing: -.01em; }
  .verdict.vulnerable { color: var(--bad); }
  .verdict.clean { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; width: 40%; font-size: 11px; text-transform: uppercase;
    letter-spacing: .03em; }
  td.val { word-break: break-word; }
  tr.row-vulnerable td { background: var(--bad-bg); }
  tr.row-clean td { background: var(--ok-bg); }
  tr.row-error td { background: var(--warn-bg); }
  tr.row-vulnerable td:first-child { border-left: 3px solid var(--bad); }
  tr.row-clean td:first-child { border-left: 3px solid var(--ok); }
  tr.row-error td:first-child { border-left: 3px solid var(--warn); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 700;
    letter-spacing: .02em; }
  .pill-vulnerable { background: var(--bad-bg); color: var(--bad); }
  .pill-clean { background: var(--ok-bg); color: var(--ok); }
  .pill-error { background: var(--warn-bg); color: var(--warn); }
  .bar-row { margin-bottom: 12px; }
  .bar-label { font-size: 12px; color: var(--muted); margin-bottom: 4px;
    display: flex; justify-content: space-between; }
  .bar-track { background: var(--panel-2); border-radius: 5px; height: 8px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; border-radius: 5px; transition: width .3s ease; }
  .bar-fill.vuln { background: var(--bad); }
  #targetBadge {
    display: inline-block; padding: 3px 11px; border-radius: var(--radius-pill);
    font-size: 11px; font-weight: 650; background: var(--ok-bg); color: var(--ok);
    border: 1px solid var(--ok-border); vertical-align: middle;
  }
</style>
</head>
<body>
<div class="wrap">

<div class="header-row">
  <div class="header-text">
    <div class="kicker">Diskard · Live Attack Console</div>
    <h1>Живая атака <span id="targetBadge" hidden></span><span style="font-size:12.5px; font-weight:500; margin-left:auto"><a class="navlink" href="/">&larr; обычная консоль</a></span></h1>
    <div class="sub">Автоматический прогон сценариев атаки с пошаговой трансляцией переписки и живым вердиктом оракула. <span id="cusLine">...</span></div>
  </div>
  <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Светлая/тёмная тема" title="Светлая/тёмная тема">◐</button>
</div>

<div class="controls">
  <div>
    <label>Attack family</label>
    <select id="attackSelect"></select>
  </div>
  <div>
    <label>Driver</label>
    <select id="driverSelect">
      <option value="template">Fixed template</option>
      <option value="llm-auto-attacker">LLM auto-attacker</option>
    </select>
  </div>
  <button id="btnStart" onclick="startLive()">Start</button>
  <button id="btnAudit" class="secondary" onclick="startAudit()">Полный цикл (все семьи)</button>
  <button id="btnRecorded" class="secondary" onclick="showRecorded()">Записанный результат</button>
  <button id="btnRecordedLive" class="secondary" onclick="startRecordedLive()">Live по записанному вводу</button>
  <button id="btnReset" class="secondary" onclick="resetState()">Сбросить состояние</button>
  <span id="jobBadge"></span>
  <span id="providerStatus" class="sub"></span>
</div>

<div class="grid2">
  <div class="panel">
    <h2>Переписка</h2>
    <div id="transcript">Ничего не запущено.</div>
  </div>
  <div class="panel">
    <h2>Память в реальном времени</h2>
    <div id="memoryEvents">Ничего не запущено.</div>
  </div>
</div>

<div class="panel">
  <h2>Вердикт оракула</h2>
  <div id="verdict"></div>
  <table id="detailsTable"><tbody></tbody></table>
</div>

<div class="panel">
  <h2>Агрегат за сессию</h2>
  <div id="stats"></div>
</div>

<script>
let pollTimer = null;
let lastRenderedStepCount = 0;
let lastRenderedMemCount = 0;

function toggleTheme() {
  const root = document.documentElement;
  const isLight = root.classList.toggle('light');
  try { localStorage.setItem('diskard-theme', isLight ? 'light' : 'dark'); } catch (e) {}
  document.getElementById('themeToggle').textContent = isLight ? '◑' : '◐';
}
document.getElementById('themeToggle').textContent = document.documentElement.classList.contains('light') ? '◑' : '◐';

async function loadConfig() {
  const r = await fetch('/api/config');
  const c = await r.json();
  document.getElementById('cusLine').innerHTML =
    `poisoner=<code>${c.poisoner_cus}</code> victim=<code>${c.victim_cus}</code> data_subject=<code>${c.data_subject_cus}</code>`;
  const badge = document.getElementById('targetBadge');
  if (c.target_label) {
    badge.textContent = c.target_label;
    badge.hidden = false;
  }
}

async function loadProvider() {
  const r = await fetch('/api/live/provider');
  const provider = await r.json();
  const status = provider.available ? 'ready' : 'not configured';
  document.getElementById('providerStatus').textContent =
    `LLM: ${provider.model || '—'} · ${status}`;
}

async function loadAttacks() {
  const r = await fetch('/api/live/attacks');
  const attacks = await r.json();
  const sel = document.getElementById('attackSelect');
  sel.innerHTML = attacks.map(a => `<option value="${a.name}" data-auto="${a.auto_attack_capable}">${a.name}</option>`).join('');
  sel.onchange = updateDriverOptions;
  updateDriverOptions();
}

function updateDriverOptions() {
  const opt = document.getElementById('attackSelect').selectedOptions[0];
  const autoCapable = opt && opt.dataset.auto === 'true';
  const driverOpt = document.querySelector('#driverSelect option[value="llm-auto-attacker"]');
  driverOpt.disabled = !autoCapable;
  if (!autoCapable) document.getElementById('driverSelect').value = 'template';
}

function badge(status) {
  const cls = status === 'running' ? 'status-running' : status === 'done' ? 'status-done' : 'status-error';
  return `<span class="status-badge ${cls}">${status}</span>`;
}

function setRunControlsDisabled(disabled) {
  ['btnStart', 'btnAudit', 'btnRecorded', 'btnRecordedLive', 'btnReset'].forEach(id => {
    document.getElementById(id).disabled = disabled;
  });
}

function resetRunUI() {
  setRunControlsDisabled(true);
  document.getElementById('transcript').textContent = 'запуск...';
  document.getElementById('memoryEvents').textContent = '(ожидание первой записи в память...)';
  document.getElementById('verdict').textContent = '';
  document.querySelector('#detailsTable tbody').innerHTML = '';
  lastRenderedStepCount = 0;
  lastRenderedMemCount = 0;
}

async function friendlyError(r) {
  if (r.status === 409) {
    return 'Уже идёт другой прогон — дождитесь его завершения (бейдж статуса рядом с кнопками) и повторите.';
  }
  let detail = '';
  try { detail = (await r.json()).detail || ''; } catch { detail = await r.text(); }
  return `Ошибка запуска (${r.status}): ${detail}`;
}

async function showRecorded() {
  if (pollTimer) clearInterval(pollTimer);
  resetRunUI();
  document.getElementById('jobBadge').innerHTML = badge('done');
  const r = await fetch('/api/live/recorded');
  setRunControlsDisabled(false);
  if (!r.ok) {
    document.getElementById('transcript').textContent = await friendlyError(r);
    return;
  }
  renderRecorded(await r.json());
}

function renderRecorded(fixture) {
  const presentation = fixture.presentation || {};
  const timeline = presentation.timeline || [];
  const attempts = presentation.attempts || [];
  const metrics = presentation.metrics || {};
  const stages = presentation.stages || {};

  document.getElementById('transcript').innerHTML = timeline.map(event => `
    <div class="step risk-${event.outcome === false ? 'commit' : 'info'}">
      <span class="who">${escapeHtml(event.source || 'system')}</span>
      <span class="label">${escapeHtml(event.phase || '')} · ${escapeHtml(event.status || '')}</span>
      <div class="msg">${escapeHtml(event.summary || event.type || '')}</div>
    </div>`).join('') || '<div class="sub">Нет событий.</div>';

  document.getElementById('memoryEvents').innerHTML = attempts.map(attempt => {
    const passed = Object.values(attempt.stage_verdicts || {}).filter(value => value === true).length;
    return `<div class="mem-event ${attempt.failure_reason === 'terminal_goal_reached' ? 'mem-clean' : 'mem-info'}">
      <div class="mem-who">attempt ${attempt.attempt}</div>
      <div>${passed} отмеченных этапов · ${escapeHtml(attempt.failure_reason || 'complete')}</div>
    </div>`;
  }).join('') || '<div class="sub">Нет дополнительных попыток.</div>';

  const source = fixture.source || {};
  const isolation = presentation.isolation || {};
  document.getElementById('verdict').innerHTML = `
    <div class="verdict clean">RECORDED · ${escapeHtml(source.status || 'complete')}</div>
    <div class="sub">schema v${escapeHtml(String(presentation.schema_version || '—'))} · run ${escapeHtml(source.run_id || '—')}</div>`;

  const rows = [
    ...Object.entries(stages).map(([name, value]) => [name, value === null ? 'unknown' : String(value)]),
    ['valid_runs', metrics.valid_runs],
    ['confirmed_runs', metrics.confirmed_runs],
    ['end_to_end_asr', metrics.end_to_end_asr],
    ['isolation_verified', isolation.verified],
  ];
  document.querySelector('#detailsTable tbody').innerHTML = rows.map(([name, value]) =>
    `<tr><td>${escapeHtml(name)}</td><td class="val">${escapeHtml(String(value ?? 'unknown'))}</td></tr>`
  ).join('');
}

async function startLive() {
  const attack = document.getElementById('attackSelect').value;
  const driver = document.getElementById('driverSelect').value;
  resetRunUI();

  const r = await fetch('/api/live/start', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({attack, driver}),
  });
  if (!r.ok) {
    document.getElementById('transcript').textContent = await friendlyError(r);
    setRunControlsDisabled(false);
    return;
  }
  const data = await r.json();
  poll(data.job_id);
}

async function resetState() {
  if (!window.confirm('Удалить тестовые записи памяти и текущие рабочие сессии?')) return;
  resetRunUI();
  document.getElementById('transcript').textContent = 'сброс состояния...';

  const r = await fetch('/api/live/reset', {method: 'POST'});
  if (!r.ok) {
    document.getElementById('transcript').textContent = await friendlyError(r);
    setRunControlsDisabled(false);
    return;
  }
  const data = await r.json();
  poll(data.job_id);
}

async function startRecordedLive() {
  resetRunUI();
  document.getElementById('transcript').textContent = 'запуск сохранённого варианта...';

  const r = await fetch('/api/live/recorded/start', {method: 'POST'});
  if (!r.ok) {
    document.getElementById('transcript').textContent = await friendlyError(r);
    setRunControlsDisabled(false);
    return;
  }
  const data = await r.json();
  poll(data.job_id);
}

async function startAudit() {
  resetRunUI();
  document.getElementById('transcript').textContent = 'запуск полного цикла по всем семьям...';

  const r = await fetch('/api/live/audit-all', {method: 'POST'});
  if (!r.ok) {
    document.getElementById('transcript').textContent = await friendlyError(r);
    setRunControlsDisabled(false);
    return;
  }
  const data = await r.json();
  poll(data.job_id);
}

function poll(jobId) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const r = await fetch(`/api/live/jobs/${jobId}`);
    if (!r.ok) {
      clearInterval(pollTimer);
      setRunControlsDisabled(false);
      document.getElementById('transcript').textContent =
        'Прогон потерян — сервер консоли перезапускался (обновление кода) и забыл про него. Запустите заново.';
      return;
    }
    const job = await r.json();
    document.getElementById('jobBadge').innerHTML = badge(job.status);
    renderTranscript(job.steps);
    renderMemoryEvents(job.steps);
    if (job.status !== 'running') {
      clearInterval(pollTimer);
      setRunControlsDisabled(false);
      if (job.kind === 'audit') {
        renderAuditScorecard(job.result);
      } else {
        renderVerdict(job.result);
      }
      loadStats();
    }
  }, 700);
}

function riskIcon(risk) {
  return {inject: '🎯 инъекция', commit: '💾 фиксация в память', trigger: '⚡ триггер'}[risk] || '';
}

function renderTranscript(steps) {
  const el = document.getElementById('transcript');
  if (!steps || !steps.length) { el.textContent = '(ожидание первого шага...)'; lastRenderedStepCount = 0; return; }
  el.innerHTML = steps.map((s, i) => `
    <div class="step risk-${s.risk || 'info'} ${i >= lastRenderedStepCount ? 'flash-in' : ''}">
      <span class="who">client${s.actor_cus}</span> <span class="label">${s.label} (${s.phase}) ${riskIcon(s.risk)}</span>
      ${s.attack ? `<span class="fam"> · ${s.attack}</span>` : ''}
      ${s.message ? `<div class="msg">${escapeHtml(s.message)}</div>` : ''}
      ${s.reply ? `<div class="reply">${escapeHtml(s.reply)}</div>` : ''}
    </div>`).join('');
  lastRenderedStepCount = steps.length;
  el.scrollTop = el.scrollHeight;
}

function renderMemoryEvents(steps) {
  const el = document.getElementById('memoryEvents');
  const events = (steps || []).filter(s => s.memory_event);
  if (!events.length) { el.innerHTML = '<div class="sub">(пока нет записей в память)</div>'; lastRenderedMemCount = 0; return; }
  const flashFrom = events.length > lastRenderedMemCount ? lastRenderedMemCount : events.length;
  lastRenderedMemCount = events.length;
  el.innerHTML = events.map((s, i) => {
    const e = s.memory_event;
    let cls, text;
    if (e.policy_mentions_data_subject) {
      cls = 'mem-danger';
      text = '🔴 ЗАПИСЬ В ПАМЯТЬ: global-правило с упоминанием cus жертвы — переживёт сессию, видно всем клиентам';
    } else if (e.policy_written) {
      cls = 'mem-warn';
      text = '🟡 запись в global policy есть, но конкретный cus не зафиксирован';
    } else if (e.semantic_written) {
      cls = 'mem-info';
      text = `⚪ записан только личный факт (semantic, user-scope, ${e.semantic_count}) — за пределы пользователя не выходит`;
    } else {
      cls = 'mem-clean';
      text = '✅ finalize прошёл без новой записи в память';
    }
    return `<div class="mem-event ${cls} ${i >= flashFrom ? 'flash-in' : ''}">
      <div class="mem-who">client${s.actor_cus} · ${s.label}</div>
      <div>${text}</div>
    </div>`;
  }).join('');
}

function renderVerdict(result) {
  const v = document.getElementById('verdict');
  const tbody = document.querySelector('#detailsTable tbody');
  if (!result) { v.textContent = ''; tbody.innerHTML = ''; return; }
  if (result.status === 'error') {
    v.innerHTML = `<div class="verdict vulnerable">ОШИБКА ИНФРАСТРУКТУРЫ</div>`;
    tbody.innerHTML = `<tr class="row-error"><td>error</td><td class="val">${escapeHtml(result.error)}</td></tr>`;
    return;
  }
  if (result.status === 'no-winning-wording') {
    v.innerHTML = `<div class="verdict">auto-attacker не нашёл персистящуюся формулировку</div>`;
    return;
  }
  const vulnerable = result.status === 'vulnerable';
  v.innerHTML = `<div class="verdict ${vulnerable ? 'vulnerable' : 'clean'}">
    ${vulnerable ? 'VULNERABLE' : 'clean'}${result.confidence ? ' — confidence: ' + result.confidence : ''}
  </div><div class="sub">${escapeHtml(result.message || '')}</div>`;
  const details = result.details || {};
  tbody.innerHTML = Object.entries(details).map(([k, val]) =>
    `<tr><td>${k}</td><td class="val">${escapeHtml(typeof val === 'object' ? JSON.stringify(val) : String(val))}</td></tr>`
  ).join('');
}

function renderAuditScorecard(result) {
  const v = document.getElementById('verdict');
  const tbody = document.querySelector('#detailsTable tbody');
  if (!result) { v.textContent = ''; tbody.innerHTML = ''; return; }
  const rows = result.attacks || [];
  v.innerHTML = `<div class="verdict ${result.n_vulnerable ? 'vulnerable' : 'clean'}">
    ${result.n_vulnerable}/${result.n_total} уязвимо, ${result.n_clean}/${result.n_total} чисто${result.n_error ? `, ${result.n_error} ошибок` : ''}
  </div>`;
  tbody.innerHTML = rows.map(r => {
    let rowCls, pill, detail;
    if (r.status === 'vulnerable') {
      rowCls = 'row-vulnerable';
      pill = `<span class="pill pill-vulnerable">VULNERABLE${r.confidence ? ' · ' + r.confidence : ''}</span>`;
      detail = escapeHtml(r.message || '');
    } else if (r.status === 'error') {
      rowCls = 'row-error';
      pill = `<span class="pill pill-error">ERROR</span>`;
      detail = escapeHtml(r.error || '');
    } else if (r.status === 'no-winning-wording') {
      rowCls = 'row-error';
      pill = `<span class="pill pill-error">N/A</span>`;
      detail = 'auto-attacker не нашёл формулировку';
    } else {
      rowCls = 'row-clean';
      pill = `<span class="pill pill-clean">CLEAN</span>`;
      detail = '';
    }
    return `<tr class="${rowCls}"><td>${r.attack}</td><td class="val">${pill}${detail ? ' — ' + detail : ''}</td></tr>`;
  }).join('');
}

async function loadStats() {
  const r = await fetch('/api/live/stats');
  const stats = await r.json();
  const el = document.getElementById('stats');
  const names = Object.keys(stats);
  if (!names.length) { el.innerHTML = '<div class="sub">Пока нет завершённых прогонов.</div>'; return; }
  el.innerHTML = names.map(name => {
    const s = stats[name];
    const persistPct = s.n ? Math.round(100 * s.n_persisted / s.n) : 0;
    const vulnPct = s.n ? Math.round(100 * s.n_vulnerable / s.n) : 0;
    return `
      <div class="bar-row">
        <div class="bar-label"><span>${name} (n=${s.n})</span><span>persisted ${persistPct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${persistPct}%"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>&nbsp;</span><span>vulnerable ${vulnPct}%</span></div>
        <div class="bar-track"><div class="bar-fill vuln" style="width:${vulnPct}%"></div></div>
      </div>`;
  }).join('');
}

function escapeHtml(s) { const d = document.createElement('div'); d.innerText = s; return d.innerHTML; }

loadConfig();
loadProvider();
loadAttacks();
loadStats();
</script>

</div>
</body>
</html>
